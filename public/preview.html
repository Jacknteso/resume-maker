<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — Resume Maker</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .preview-container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .preview-panel {
      flex: 1;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }
    .preview-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    .preview-panel-header h3 {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }
    .preview-panel iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }
    .preview-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-download {
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
    }
    .btn-download:hover {
      background: #f1f5f9;
    }
    .btn-download.primary {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .btn-download.primary:hover {
      background: #1d4ed8;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .top-bar a {
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }
    .top-bar a:hover { color: #2563eb; }

    .download-all {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .preview-container {
        flex-direction: column;
      }
      .preview-panel iframe {
        height: 60vh;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/">← Back to Editor</a>
    <h2 style="font-size:16px;font-weight:600;color:#1e293b;">📄 Your Generated Documents</h2>
    <div class="download-all">
      <a href="/download/resume" class="btn-download primary">⬇ Resume PDF</a>
      <a href="/download/cover-letter" class="btn-download primary">⬇ Cover Letter PDF</a>
    </div>
  </div>

  <div class="preview-container">
    <!-- Resume Preview -->
    <div class="preview-panel">
      <div class="preview-panel-header">
        <h3>Resume</h3>
        <div class="preview-actions">
          <a href="/download/resume" class="btn-download">⬇ PDF</a>
        </div>
      </div>
      <iframe id="resumeFrame" srcdoc="Loading..."></iframe>
    </div>

    <!-- Cover Letter Preview -->
    <div class="preview-panel">
      <div class="preview-panel-header">
        <h3>Cover Letter</h3>
        <div class="preview-actions">
          <a href="/download/cover-letter" class="btn-download">⬇ PDF</a>
        </div>
      </div>
      <iframe id="coverLetterFrame" srcdoc="Loading..."></iframe>
    </div>
  </div>

  <!-- Inline scripts are blocked by the CSP (script-src 'self'), so the
       loader lives in an external file. -->
  <script src="/js/preview.js" defer></script>
</body>
</html>
