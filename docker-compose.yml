version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-maker
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
      # Holds the decryption key (DOTENV_PRIVATE_KEY_...) for the encrypted .env
      - .env.keys
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent storage for uploads and output
      - uploads_data:/app/uploads
      - output_data:/app/output
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - resume-network
    # Security: limit resources
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    # Security: drop all capabilities, add only needed ones
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: resume-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - resume-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads_data:
    driver: local
  output_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

networks:
  resume-network:
    driver: bridge
